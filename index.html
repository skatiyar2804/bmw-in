<!DOCTYPE html>
<html>
    <head>
        <title>
            BMW In
        </title>
        <!-- This line connects your CSS file to this page -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="logo">
                BMW
            </div>
            <ul class="nav-links">
                <li>
                    <a href="#">
                        Models
                    </a>
                </li>
                <li>
                    <a href="#">
                        Design
                    </a>
                </li>
                <li>
                    <a href="#">
                        Technology
                    </a>
                </li>
                <li>
                    <a href="#">
                        Contact
                    </a>
                </li>
            </ul>
        </nav>
        <!-- HERO SECTION -->
        <div class="hero" id="hero">
            <h1>
                The Ultimate Driving Machine
            </h1>
            <p>
                Performance. Luxury. Innovation.
            </p>
            <button class="cta-btn">
                Explore Models
            </button>
            <!-- MODELS SECTION -->
            <section class="models" id="models">
                <h2 class="section-title">
                    Our Models
                </h2>
                <p class="section-sub">
                    Choose your ultimate machine
                </p>
                <div class="card-container">
                    <!-- Card 1 -->
                    <div class="card">
                        <img src="Images/m3-2.jpg" alt="BMW M3">
                        <div class="card-info">
                            <h3>
                                BMW M3
                            </h3>
                            <p>
                                Sedan · 503 HP · 0–100 in 3.5s
                            </p>
                            <button class="card-btn">
                                Discover
                            </button>
                        </div>
                    </div>
                    <!-- Card 2 -->
                    <div class="card">
                        <img src="Images/m4-1.jpg" alt="BMW M4">
                        <div class="card-info">
                            <h3>
                                BMW M4
                            </h3>
                            <p>
                                Coupe · 510 HP · 0–100 in 3.9s
                            </p>
                            <button class="card-btn">
                                Discover
                            </button>
                        </div>
                    </div>
                    <!-- Card 3 -->
                    <div class="card">
                        <img src="Images/x5-1.jpg" alt="BMW X5">
                        <div class="card-info">
                            <h3>
                                BMW X5
                            </h3>
                            <p>
                                SUV · 456 HP · 0–100 in 4.3s
                            </p>
                            <button class="card-btn">
                                Discover
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
